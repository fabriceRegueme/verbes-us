<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Verbes">

<title>Verbes anglais · iPhone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;900&display=swap">
<style>
:root{--bg:#f5f6fa;--card:#fff;--ink:#1c2233;--mute:#6b7389;--line:#e2e5ee;--red:#d32f2f;--blue:#1f5fbf;--green:#2e8b3e;--amber:#e39b0b;--grey:#c3c8d6;--fr:#d9531e;--mask:#d7dbe6;--bar:rgba(255,255,255,.92);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151f;--card:#1b2030;--ink:#eef0f6;--mute:#9aa2b8;--line:#2c3348;--fr:#ff8a5c;--mask:#38405a;--grey:#4a5270;--bar:rgba(27,32,48,.94)}}
:root[data-theme="dark"]{--bg:#12151f;--card:#1b2030;--ink:#eef0f6;--mute:#9aa2b8;--line:#2c3348;--fr:#ff8a5c;--mask:#38405a;--grey:#4a5270;--bar:rgba(27,32,48,.94)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,sans-serif;padding:14px 16px 100px;touch-action:manipulation}
button,input{font-family:inherit}
#app{max-width:760px;margin:0 auto;display:flex;flex-direction:column;align-items:center}
h1{font-size:1.4rem;margin:4px 0 10px;text-align:center}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:10px}
.chip,.btn{min-height:44px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 18px;font:700 1rem Nunito,sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.ok{border-color:var(--green)}.btn.no{border-color:var(--red)}
.btn.sug{box-shadow:0 0 0 3px var(--amber)}
.st{color:var(--mute);margin:4px 0 12px;text-align:center}
.c{--k:var(--grey);width:min(100%,560px);min-height:500px;background:var(--card);border:3px solid var(--k);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
.c.t{--k:var(--blue)}.c.d{--k:var(--green)}.c.i{--k:var(--red)}.c.x{--k:var(--amber)}
.hd{background:var(--k);color:#fff;padding:9px 18px;font-weight:800;display:flex;justify-content:space-between;font-size:1.05rem}
.fav{border:0;background:none;color:inherit;font-size:1.7rem;line-height:1;cursor:pointer;min-width:48px;min-height:32px;padding:0}.fav[aria-pressed="true"]{color:#ffd23f}.c.n .fav[aria-pressed="true"]{color:var(--amber)}
.c.n .hd{color:var(--ink)}.c.n .v{color:var(--ink)}.c.n .s{color:var(--mute)}
.bd{padding:14px 20px 18px;text-align:center;display:flex;flex-direction:column;gap:7px;flex:1}
.v{font-size:clamp(2.4rem,6vw,3.2rem);font-weight:900;color:var(--k);margin:0;line-height:1.1}
.p{font-size:clamp(1.8rem,5vw,2.3rem);font-weight:900;margin:0}
.ipa{color:var(--mute);font-size:1.05rem}
.sp{color:var(--fr);font-size:.95rem;font-weight:700}
.l{color:var(--mute);font-size:.85rem;border-top:1px solid var(--line);padding-top:9px;margin-top:5px}
.fr{color:var(--fr);font-weight:800;font-size:1.3rem}
.ph{font-weight:800;font-size:1.2rem}
.ex{font-weight:700;font-size:1.1rem}.exf{color:var(--mute);font-style:italic}
.s{border:0;background:none;cursor:pointer;font-size:1.35rem;padding:4px 10px;color:var(--k);min-height:44px}
.in{width:100%;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px;font-size:1.15rem;font-weight:700;text-align:center;user-select:text;-webkit-user-select:text}
.in.okf{border-color:var(--green)}.in.kof{border-color:var(--red)}
.mk{font-weight:900}.mk.o{color:var(--green)}.mk.n{color:var(--red)}
.c:not(.rev) .sx,.c:not(.rev) .rv{display:none}
.c:not(.rev) .a{color:transparent;background:var(--mask);border-radius:6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.tip{color:var(--mute);font-size:.85rem;margin-top:auto;padding-top:8px}
.nav{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;justify-content:center}
.empty{margin:auto;color:var(--mute);padding:24px}
.row{width:100%;max-width:560px;margin-bottom:14px}
.row b{display:block;margin-bottom:4px}
.pb{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--line)}
.pb i{display:block;height:100%}
.leg{color:var(--mute);font-size:.85rem;margin-top:4px}
.sum{text-align:center;padding:30px 10px}.sum .big{font-size:3rem;font-weight:900}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;background:var(--bar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
#tabs button{flex:1;max-width:220px;min-height:48px;border:0;border-radius:14px;background:transparent;color:var(--mute);font:800 1rem Nunito,sans-serif;cursor:pointer}
#tabs button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;margin-bottom:8px}.top .st{margin:0;font-weight:800}
.opt{display:block;width:100%;text-align:left;min-height:48px;margin:6px 0;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 14px;font:700 1rem Nunito,sans-serif;cursor:pointer}
.opt.ok{border-color:var(--green);background:rgba(46,139,62,.18)}.opt.ko{border-color:var(--red);background:rgba(211,47,47,.18)}.opt.dim{opacity:.55}
.qt{color:var(--mute);font-size:.9rem}.qv{font-size:2.1rem;font-weight:900;line-height:1.15}
.expl{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--bg);line-height:1.5}
@media (max-width:520px){
body{padding:6px 10px 76px}
.c{min-height:0;max-height:calc(100dvh - 196px);overflow-y:auto;border-radius:18px}
.hd{padding:5px 12px;font-size:.95rem}.fav{font-size:1.5rem;min-height:28px}
.bd{padding:8px 14px 10px;gap:3px}
.v{font-size:2.1rem}.p{font-size:1.6rem}.ipa{font-size:.9rem}.sp{font-size:.85rem}
.l{font-size:.75rem;padding-top:5px;margin-top:2px}.fr{font-size:1.1rem}.ph{font-size:1rem}.ex{font-size:.95rem}.exf{font-size:.85rem}
.s{min-height:34px;padding:0 8px;font-size:1.15rem}.in{padding:9px;font-size:1rem}
.chip{min-height:38px;padding:5px 12px;font-size:.9rem}
.nav{margin-top:8px;gap:8px;flex-wrap:nowrap}.btn{flex:1;min-height:46px;padding:6px 8px;font-size:.95rem}
#tabs{padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}#tabs button{font-size:.88rem;min-height:44px}
.tip{padding-top:4px}
}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
</style>
</head>

var FV=ld("vb:fav:v1",{});
function isFav(c){return !!FV[c.v]}
var S={tab:"study",fl:false,q:null,lv:"",ty:"",n:20,hint:false,rev:false,pos:0,deck:[],ans:{p:"",t:""},ok:0,no:0,done:false,foc:false,rc:false};
(function(){var p=ld(PK,{});["lv","ty","n","hint"].forEach(function(k){if(p[k]!==undefined)S[k]=p[k]})})();
function prefs(){sv(PK,{lv:S.lv,ty:S.ty,n:S.n,hint:S.hint})}
function bx(c){return P[c.v]?P[c.v].b:-1}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
function norm(t){return t.toLowerCase().replace(/\([^)]*\)/g,"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’‘`]/g,"'").replace(/\s+/g," ").trim().replace(/^(se |s')/,"")}
function okP(c,v){var n=v.toLowerCase().trim();return !!n&&c.p.toLowerCase().split("/").map(function(x){return x.trim()}).indexOf(n)>-1}
function okT(c,v){var n=norm(v);return !!n&&c.fr.split(/[,\/]/).map(norm).indexOf(n)>-1}
function say(w,slow){try{var u=new SpeechSynthesisUtterance(w);u.lang="en-US";if(slow)u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function pool(){return D.filter(function(c){return(!S.lv||c.l===S.lv)&&(!S.ty||(S.ty==="r"?c.k!=="x":S.ty==="x"?c.k==="x":S.ty==="f"?!!FV[c.v]:(P[c.v]&&P[c.v].b===0)))})}
function build(){
var cs=pool();
if(S.tab==="exo"||S.tab==="quiz")cs=cs.map(function(c){return[(bx(c)<0?.5:bx(c))+Math.random()*.4,c]}).sort(function(a,b){return a[0]-b[0]}).map(function(x){return x[1]}).slice(0,S.n);
S.deck=cs;S.pos=0;S.rev=false;S.ans={p:"",t:""};S.ok=0;S.no=0;S.done=false;S.foc=true;S.q=S.tab==="quiz"?{qs:cs.map(mkq),i:0,sc:0,sel:-1}:null;render()}
function chips(items,cur,act){return items.map(function(it){return'<button class="chip" data-a="'+act+':'+it[0]+'" aria-pressed="'+(String(cur)===String(it[0]))+'">'+it[1]+'</button>'}).join("")}
function filters(){
var tl={r:"Réguliers",x:"Irréguliers",a:"À revoir",f:"★ Favoris"};
var cnt=(S.deck.length&&!S.done)?(S.pos+1)+" / "+S.deck.length+(S.tab==="quiz"&&S.q?" · ✓ "+S.q.sc:""):"";
var h='<div class="top"><span class="st">'+cnt+'</span><button class="chip" data-a="fl" aria-pressed="'+S.fl+'">⚙ '+(S.lv||"Tous")+' · '+(tl[S.ty]||"Tous")+'</button></div>';
if(S.fl){h+='<div class="bar">'+chips([["","Tous"]].concat(LV.map(function(x){return[x,x]})),S.lv,"lv")+'</div>'+
'<div class="bar">'+chips([["","Tous"],["r","Réguliers"],["x","Irréguliers"],["a","À revoir"],["f","★ Favoris"]],S.ty,"ty")+'</div>';
if(S.tab==="exo"||S.tab==="quiz")h+='<div class="bar">'+chips([[10,"10"],[20,"20"],[50,"50"]],S.n,"n")+(S.tab==="exo"?'<button class="chip" data-a="hint" aria-pressed="'+S.hint+'">Indice couleur</button>':'')+'</div>';
if(S.tab==="study")h+='<div class="bar"><button class="chip" data-a="shuf">🔀 Mélanger</button></div>'}
return h}
function card(c,study){
var rev=S.rev,m=rev?"false":"true",exo=!study;
var gp=exo&&okP(c,S.ans.p),gt=exo&&okT(c,S.ans.t);
var show=study||S.hint||rev;
function a(x){return'<span class="a" aria-hidden="'+m+'">'+x+'</span>'}
function mk(g){return exo&&rev?' <span class="mk '+(g?'o">✓':'n">✗')+'</span>':''}
function inp(id,val,g,ph){return'<input id="'+id+'" class="in'+(rev?(g?' okf':' kof'):'')+'" value="'+esc(val)+'" placeholder="'+ph+'" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="next"'+(rev?' readonly':'')+'>'}
var h='<article class="c '+(show?c.k:"n")+(rev?" rev":"")+'"'+(study?' data-a="flip"':'')+'><div class="hd"><span>'+c.l+'</span><button class="fav" data-a="fav" aria-pressed="'+isFav(c)+'" aria-label="'+(isFav(c)?"Retirer des favoris":"Ajouter aux favoris")+'">'+(isFav(c)?"★":"☆")+'</button><span>'+(rev?(c.k==="x"?"irrégulier":SN[c.k]):"?")+'</span></div><div class="bd">'+
'<h2 class="v">'+c.v+'</h2><div class="ipa">'+c.i+'<button class="s" data-a="say:v" aria-label="Écouter le verbe">🔊</button></div><div class="sp">≈ '+c.s+'</div>'+
'<div class="l">Prétérit'+mk(gp)+'</div>';
if(exo){h+=inp("ip",S.ans.p,gp,"Votre prétérit")+'<div class="rv"><p class="p">'+c.p+'</p><div class="ipa">'+c.pi+'<button class="s sx" data-a="say:p" aria-label="Écouter le prétérit">🔊</button></div><div class="sp">≈ '+c.ps+'</div></div>'+
'<div class="l">Traduction'+mk(gt)+'</div>'+inp("it",S.ans.t,gt,"Votre traduction")+'<div class="rv"><div class="fr">'+c.fr+'</div></div>'}
else{h+='<p class="p">'+a(c.p)+'</p><div class="ipa">'+a(c.pi)+'<button class="s sx" data-a="say:p" aria-label="Écouter le prétérit">🔊</button></div><div class="sp">≈ '+a(c.ps)+'</div><div class="l">Traduction</div><div class="fr">'+a(c.fr)+'</div>'}
if(c.ph)h+='<div class="l">Phrasal verb</div><div class="ph">'+c.ph+'</div><div class="fr" style="font-size:1.05rem">'+a(c.phf)+'</div>';
h+='<div class="l">Exemple<button class="s sx" data-a="say:x" aria-label="Écouter l’exemple">🔊</button></div><div class="ex">'+a(c.ex)+'</div><div class="exf">'+a(c.exf)+'</div>'+
'<div class="tip">'+(study?(rev?"Touchez la carte pour masquer":"Touchez la carte pour voir la réponse"):"")+'</div></div></article>';
return h}
function render(){
var app=document.getElementById("app");
document.querySelectorAll("#tabs button").forEach(function(b){b.dataset.a==="tab:"+S.tab?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current")});
if(S.tab==="prog"){app.innerHTML=prog();return}
var h=filters();
if(!S.deck.length){app.innerHTML=h+'<div class="empty">Aucune carte pour ce filtre. Les cartes ratées en Exercice apparaissent dans « À revoir », et celles que vous marquez ☆ dans « Favoris ».</div>';return}
if(S.done){var tot=S.ok+S.no;app.innerHTML=h+'<div class="sum"><div class="big">'+S.ok+' / '+tot+'</div><p>'+(S.tab==="quiz"?"bonnes réponses":"cartes sues")+' dans cette session.</p><div class="nav"><button class="btn pri" data-a="again">Nouvelle session</button></div></div>';return}
if(S.tab==="quiz"){app.innerHTML=h+quizView();return}
var c=S.deck[S.pos];
h+=card(c,S.tab==="study");
if(S.tab==="study")h+='<div class="nav"><button class="btn" data-a="prev" aria-label="Précédent">◀</button><button class="btn pri" data-a="flip">'+(S.rev?"Masquer":"Voir la réponse")+'</button><button class="btn" data-a="next" aria-label="Suivant">▶</button></div>';
else if(!S.rev)h+='<div class="nav"><button class="btn" data-a="skip">Passer</button><button class="btn pri" data-a="check">Vérifier</button></div>';
else{var good=okP(c,S.ans.p)&&okT(c,S.ans.t);h+='<div class="nav"><button class="btn no'+(good?'':' sug')+'" data-a="no">À revoir</button><button class="btn ok'+(good?' sug':'')+'" data-a="ok">Je savais</button></div>'}
app.innerHTML=h;
if(S.foc&&S.tab==="exo"&&!S.rev){var e=document.getElementById("ip");if(e)e.focus({preventScroll:true})}
S.foc=false}
function prog(){
var h='<h1>Progrès</h1>',all=0,mas=0;
LV.forEach(function(l){
var cs=D.filter(function(c){return c.l===l});if(!cs.length)return;
var m=0,e=0,r=0,n=0;cs.forEach(function(c){var b=bx(c);if(b<0)n++;else if(b>=3)m++;else if(b===0)r++;else e++});
all+=cs.length;mas+=m;var w=function(x){return(x/cs.length*100)+"%"};
h+='<div class="row"><b>'+l+' · '+cs.length+' cartes</b><div class="pb"><i style="width:'+w(m)+';background:var(--green)"></i><i style="width:'+w(e)+';background:var(--amber)"></i><i style="width:'+w(r)+';background:var(--red)"></i></div><div class="leg">Maîtrisées '+m+' · En cours '+e+' · À revoir '+r+' · Nouvelles '+n+'</div></div>'});
h=h.replace('<h1>Progrès</h1>','<h1>Progrès</h1><div class="st">'+mas+' cartes maîtrisées sur '+all+'</div>');
var nf=Object.keys(FV).length;
h+='<div class="row"><b>★ Mes favoris : '+nf+'</b><div class="leg">Touchez ☆ en haut d’une carte pour la garder de côté, puis révisez-les ici quand vous voulez. La remise à zéro ne supprime pas vos favoris.</div></div><div class="nav"><button class="btn pri" data-a="favgo"'+(nf?'':' disabled')+'>Réviser mes favoris</button></div>';
h+='<div class="row"><b>Installer sur l’iPhone</b><div class="leg">Dans Safari : bouton Partager, puis « Sur l’écran d’accueil ». Votre progression est enregistrée sur cet appareil.</div></div>';
h+='<div class="nav"><button class="btn no" data-a="reset">'+(S.rc?"Confirmer la remise à zéro":"Remettre à zéro")+'</button></div>';
return h}
function gradeCard(c,v){var p=P[c.v]||{b:0,n:0,ok:0};p.n++;if(v){p.b=Math.min(5,Math.max(0,p.b)+1);p.ok++}else p.b=0;P[c.v]=p;sv(KEY,P)}
function grade(v){var c=S.deck[S.pos];if(!c||S.done)return;gradeCard(c,v);if(v)S.ok++;else S.no++;next()}
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function others(c,f,n){var pl=D.filter(function(x){return x!==c&&x.l===c.l});if(pl.length<n+3)pl=D.filter(function(x){return x!==c});
var out=[],seen={};shuf(pl).forEach(function(x){var v=f(x);if(out.length<n&&v&&v!==f(c)&&!seen[v]){seen[v]=1;out.push(v)}});return out}
function naive(v){var p=v.split(" ");p[0]=/e$/.test(p[0])?p[0]+"d":p[0]+"ed";return p.join(" ")}
function mkq(c){
var re=c.p.indexOf("/")>-1?null:new RegExp("\\b"+c.p.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i");
var types=["past","trad","sound"];if(re&&re.test(c.ex))types.push("gap");
var t=rnd(types),q={c:c,t:t};
if(t==="trad"){q.o=shuf([c.fr].concat(others(c,function(x){return x.fr},3)));q.a=q.o.indexOf(c.fr)}
else if(t==="sound"){q.o=["/t/","/d/","/ɪd/","irrégulier"];q.a=["t","d","i","x"].indexOf(c.k)}
else{var ds=others(c,function(x){return x.p},3);
if(c.k==="x"){var nv=naive(c.v);if(nv!==c.p&&ds.indexOf(nv)<0){if(ds.length>=3)ds[0]=nv;else ds.push(nv)}}
q.o=shuf([c.p].concat(ds.slice(0,3)));q.a=q.o.indexOf(c.p);
if(t==="gap")q.s=c.ex.replace(re,"_____")}
return q}
function quizView(){var Q=S.q,q=Q.qs[Q.i],c=q.c,an=Q.sel>-1,h='';
var head={past:"Quel est le prétérit de",trad:"Que signifie",sound:"Comment se termine le prétérit",gap:"Complétez la phrase"}[q.t];
h+='<article class="c '+(an?c.k:"n")+'"><div class="hd"><span>'+c.l+'</span><button class="fav" data-a="fav" aria-pressed="'+isFav(c)+'" aria-label="Favori">'+(isFav(c)?"★":"☆")+'</button><span>'+(an?(c.k==="x"?"irrégulier":SN[c.k]):"?")+'</span></div><div class="bd" style="text-align:left">';
h+='<div class="qt">'+head+'</div>';
if(q.t==="past"||q.t==="trad")h+='<div class="qv">'+c.v+'<button class="s" data-a="say:v" aria-label="Écouter">🔊</button></div><div class="sp">≈ '+c.s+'</div>';
else if(q.t==="sound")h+='<div class="qv">'+c.p+'</div>';
else h+='<div class="ex" style="font-size:1.05rem">'+q.s+'</div><div class="exf">'+c.exf+'</div>';
q.o.forEach(function(o,i){h+='<button class="opt'+(an?(i===q.a?" ok":(i===Q.sel?" ko":" dim")):"")+'" data-a="qa:'+i+'">'+o+'</button>'});
if(an){h+='<div class="expl"><b>'+(Q.sel===q.a?"✓ Bravo !":"✗ Réponse : "+q.o[q.a])+'</b><br>'+c.v+' <span class="sp">≈ '+c.s+'</span> → <b>'+c.p+'</b> <span class="sp">≈ '+c.ps+'</span><button class="s" data-a="say:p" aria-label="Écouter le prétérit">🔊</button><br><span class="fr" style="font-size:1rem">'+c.fr+'</span></div>'}
h+='</div></article>';
if(an)h+='<div class="nav"><button class="btn pri" data-a="qnext">'+(Q.i+1>=Q.qs.length?"Voir le score":"Suivant")+'</button></div>';
return h}
function next(){S.pos++;S.rev=false;S.ans={p:"",t:""};S.foc=true;if(S.pos>=S.deck.length){if(S.tab==="exo")S.done=true;else S.pos=0}render()}
function prev(){S.pos=(S.pos-1+S.deck.length)%S.deck.length;S.rev=false;render()}
function act(a){
var i=a.indexOf(":"),n=i<0?a:a.slice(0,i),v=i<0?"":a.slice(i+1);
if(n!=="reset")S.rc=false;
if(n==="tab"){S.tab=v;S.fl=false;build()}
else if(n==="lv"){S.lv=v;prefs();build()}
else if(n==="ty"){S.ty=v;prefs();build()}
else if(n==="n"){S.n=+v;prefs();build()}
else if(n==="hint"){S.hint=!S.hint;prefs();render()}
else if(n==="flip"||n==="check"){if(S.deck.length){S.rev=!S.rev;render()}}
else if(n==="next"){next()}
else if(n==="prev"){prev()}
else if(n==="skip"){next()}
else if(n==="shuf"){for(var j=S.deck.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1)),t=S.deck[j];S.deck[j]=S.deck[k];S.deck[k]=t}S.pos=0;S.rev=false;render()}
else if(n==="ok"){grade(true)}
else if(n==="no"){grade(false)}
else if(n==="again"){build()}
else if(n==="say"){var c=S.deck[S.pos];if(c)say(v==="v"?c.v:v==="p"?c.p:c.ex,v==="x")}
else if(n==="fav"){var fc=S.deck[S.pos];if(fc){if(FV[fc.v])delete FV[fc.v];else FV[fc.v]=1;sv("vb:fav:v1",FV);render()}}
else if(n==="favgo"){S.tab="exo";S.ty="f";S.lv="";prefs();build()}
else if(n==="fl"){S.fl=!S.fl;render()}
else if(n==="qa"){var qq=S.q&&S.q.qs[S.q.i];if(qq&&S.q.sel<0){S.q.sel=+v;var okq=(+v===qq.a);if(okq)S.q.sc++;gradeCard(qq.c,okq);render()}}
else if(n==="qnext"){S.q.i++;S.q.sel=-1;S.pos=S.q.i;if(S.q.i>=S.q.qs.length){S.done=true;S.ok=S.q.sc;S.no=S.q.qs.length-S.q.sc}render()}
else if(n==="reset"){if(S.rc){P={};sv(KEY,P);S.rc=false}else S.rc=true;render()}}
var app=document.getElementById("app");
document.addEventListener("click",function(e){var t=e.target.closest("[data-a]");if(t)act(t.dataset.a)});
app.addEventListener("input",function(e){if(e.target.id==="ip")S.ans.p=e.target.value;if(e.target.id==="it")S.ans.t=e.target.value});
app.addEventListener("keydown",function(e){if(e.key!=="Enter")return;e.preventDefault();
if(e.target.id==="ip"){var t=document.getElementById("it");if(t)t.focus()}else if(e.target.id==="it"&&!S.rev)act("check")});
var tx=0,ty=0;
app.addEventListener("touchstart",function(e){tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
app.addEventListener("touchend",function(e){if(S.tab!=="study"||!S.deck.length)return;var dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
if(Math.abs(dx)>70&&Math.abs(dy)<50){dx<0?next():prev()}},{passive:true});
build();
</script>
</body>
</html>
